<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>By Fran Circuit - บิลงานซ่อม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ตั้งค่าให้เวลาพิมพ์บิล เส้นตารางคมชัดขึ้น */
    .print-border td, .print-border th { border-color: #22d3ee; border-width: 1px; border-style: solid; }
  </style>
</head>
<body class="bg-gray-100 p-2 md:p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- ฟอร์มสร้างบิล -->
    <form id="repairForm" class="bg-white p-6 rounded-lg shadow-md border border-gray-300">
      <div id="billArea" class="bg-white p-4 border-2 border-cyan-400 rounded-lg relative pb-8">
        
        <!-- โลโก้ และ หัวบิล -->
        <div class="flex justify-between items-start mb-6 border-b-2 border-cyan-200 pb-4">
          <div class="flex items-center gap-4">
            <!-- ใส่ชื่อไฟล์โลโก้ของคุณที่นี่ (นำรูปไปวางในโฟลเดอร์ public) -->
            <img src="logo.png" alt="Logo" class="h-16 w-16 object-contain border rounded" onerror="this.style.display='none'">
            <div>
              <h1 class="text-3xl font-extrabold text-gray-800">By Fran Circuit</h1>
              <p class="text-sm text-gray-600">ที่อยู่ 3/10 หมู่ 5 ทุ่งบางกระแบล ต.นาป่า อ.เมือง จ.ชลบุรี 20000</p>
            </div>
          </div>
          <div class="text-center bg-cyan-100 px-8 py-3 rounded-xl border-2 border-cyan-400 shadow-sm">
            <h2 class="text-2xl font-bold text-cyan-900">บิลเงินสด</h2>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4">
          <div class="md:col-span-2 border border-cyan-300 p-4 rounded-lg space-y-3 bg-white">
            <div class="flex items-center gap-2"><label class="text-sm font-bold w-24">ชื่อลูกค้า:</label> <input type="text" id="customer_name" class="flex-1 border p-1.5 rounded focus:ring-2 focus:ring-cyan-300 outline-none" required></div>
            <div class="flex items-center gap-2"><label class="text-sm font-bold w-24">ที่อยู่:</label> <input type="text" id="customer_address" class="flex-1 border p-1.5 rounded focus:ring-2 focus:ring-cyan-300 outline-none"></div>
          </div>
          <div class="border border-cyan-300 p-4 rounded-lg space-y-3 bg-white">
            <div class="flex items-center gap-2"><label class="text-sm font-bold w-28">เลขที่ / No.:</label> <input type="text" id="bill_no" class="flex-1 border p-1.5 rounded bg-gray-50 text-red-600 font-bold" readonly></div>
            <!-- ดัดแปลงวันที่ให้แสดงผลเป็น วัน/เดือน/ปี แบบไทยด้วย JS -->
            <div class="flex items-center gap-2"><label class="text-sm font-bold w-28">วันที่ / Date:</label> <input type="text" id="date_display" class="flex-1 border p-1.5 rounded bg-gray-50" readonly></div>
            <input type="hidden" id="date" name="date">
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <!-- ตารางรายการ -->
          <div class="flex-1">
            <table class="w-full text-sm print-border">
              <thead>
                <tr class="bg-cyan-50">
                  <th class="p-2 w-12 text-center">ลำดับ</th>
                  <th class="p-2 text-left">รายการ (Descriptions)</th>
                  <th class="p-2 w-20 text-center">จำนวน</th>
                  <th class="p-2 w-24 text-right">หน่วยละ</th>
                  <th class="p-2 w-28 text-right">จำนวนเงิน</th>
                </tr>
              </thead>
              <tbody id="itemsTable"></tbody>
              <!-- ส่วนสรุปยอดเงินและข้อความภาษาไทย -->
              <tfoot>
                <tr>
                  <td colspan="2" class="p-2 text-center font-bold text-cyan-800 bg-cyan-50" id="total_text_thai">( ศูนย์บาทถ้วน )</td>
                  <td colspan="2" class="p-2 text-right font-bold border-t border-cyan-400">รวมเงิน</td>
                  <td class="p-2 text-right font-bold border-t border-cyan-400 text-red-600 text-lg underline decoration-double" id="grand_total">0.00</td>
                </tr>
              </tfoot>
            </table>
            <button type="button" id="btnAddItem" onclick="addItemRow()" class="mt-3 bg-blue-500 text-white px-4 py-1.5 rounded text-sm hover:bg-blue-600 shadow">+ เพิ่มรายการอะไหล่</button>
          </div>

          <!-- ข้อมูลงานซ่อม (จะถูกซ่อนตอนดาวน์โหลดบิล) -->
          <div id="sideBox" class="w-full md:w-64 bg-orange-50 p-4 rounded-lg border border-orange-300 space-y-2 text-sm shadow-sm h-fit">
            <h3 class="font-extrabold text-orange-900 text-center border-b border-orange-200 pb-2 mb-2">ข้อมูลงานซ่อม (บันทึกหลังบ้าน)</h3>
            <div class="flex flex-col"><span class="font-bold">ส่งงาน:</span> <input type="text" id="repair_sender" class="border p-1 rounded"></div>
            <div class="flex flex-col"><span class="font-bold">Class:</span> <input type="text" id="amp_class" class="border p-1 rounded" placeholder="เช่น Class D"></div>
            <div class="flex flex-col"><span class="font-bold">ยี่ห้อ:</span> <input type="text" id="amp_brand" class="border p-1 rounded"></div>
            <div class="flex flex-col"><span class="font-bold">กำลัง:</span> <input type="text" id="amp_power" class="border p-1 rounded" placeholder="เช่น 5000"></div>
            <div class="flex flex-col"><span class="font-bold">อาการ:</span> <input type="text" id="symptom" class="border p-1 rounded" placeholder="เช่น โพรเทค"></div>
          </div>
        </div>

        <div id="uploadBox" class="flex justify-between items-center bg-gray-50 p-3 border border-gray-300 rounded mt-4">
          <span class="font-bold">แนบรูปภาพงานซ่อม:</span>
          <input type="file" id="repair_image" accept="image/*" class="text-sm">
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-4">
        <button type="submit" class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-green-700 shadow-lg text-lg">บันทึกบิล</button>
        <button type="button" onclick="downloadBillImage()" class="bg-purple-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-purple-700 shadow-lg text-lg">ดาวน์โหลดบิลเป็นรูปภาพ</button>
      </div>
    </form>

    <!-- Datalist สำหรับโหลดชื่ออะไหล่จากฐานข้อมูลมาเป็น Auto-complete -->
    <datalist id="partsList"></datalist>

  </div>
  <script src="script.js"></script>
</body>
</html>
